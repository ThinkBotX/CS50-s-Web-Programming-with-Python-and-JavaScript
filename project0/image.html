<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Right Navigation Links -->
    <header class="nav-container">
        <a href="index.html" class="nav-link">Google Search</a>
    </header>

    <!-- Main Search Body -->
    <main class="search-main">
        <div class="logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
            <span class="sub-logo">images</span>
        </div>

        <form action="https://www.google.com/search" method="GET">
            <!-- Hidden parameter forcing Google to return Image results -->
            <input type="hidden" name="tbm" value="isch">
            
            <div class="search-box-wrapper">
                <svg class="search-icon" focusable="false" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                <input type="text" name="q" autocomplete="off" class="search-input" required>
            </div>
            
            <div class="button-container">
                <input type="submit" value="Image Search" class="btn">
            </div>
        </form>
    </main>
</body>
</html>
